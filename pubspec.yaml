name: is_github_relay
description: >-
  GitHub's part of an is_relay relay: the HMAC check of a webhook delivery,
  the key the docking station decides it under, and the sweep that asks
  GitHub to redeliver what failed, since GitHub never does by itself.
version: 0.5.0
repository: https://github.com/intersyntactic/github_relay

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  crypto: ^3.0.3
  is_docking_station_api: ^0.7.0
  is_relay: ^0.3.0

dev_dependencies:
  is_logbook_client: ^0.3.0
  lints: ^6.1.0
  test: ^1.33.0
