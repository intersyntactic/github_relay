name: publish

# Builds and publishes a versioned image to GHCR. The box then deploys by
# pulling a pinned version -- no rsync, no build-on-box, no source on the
# host.

on:
  push:
    branches: [main]
    # Publish only when IMAGE CONTENT changed -- an allowlist of exactly what
    # the Dockerfile COPYs, plus the Dockerfile itself. Failing closed: a new
    # COPY line with no matching entry here means no publish rather than a
    # bad one, the opposite of a denylist's failure mode.
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'Dockerfile'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: version
        run: |
          value=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Three outcomes, not two: `docker manifest inspect` returning nonzero
      # on EVERY kind of failure (missing tag, DNS error, 403) is how
      # enspyrco/realm-token-server#18 made this guard fail OPEN -- a check
      # that could not run read the same as a check that found nothing, and
      # published anyway. `imagetools inspect` says "not found" in its own
      # text only for a tag that is genuinely absent; a transport or auth
      # failure says something else, and only that case is let through.
      #
      # Three outcomes, not two, on the job's conclusion too: an existing
      # tag that THIS commit built is not a publish failure, it's "nothing
      # to release" -- a push that didn't bump the version shouldn't go red
      # on every later step skipping, or red stops meaning "something
      # broke." But an existing tag that some OTHER commit built means the
      # code moved on without a version bump -- main and the published
      # version would be two different APIs under one number -- and that
      # must stay red, not skip quietly. The per-commit sha-<sha> tag is
      # what tells those two cases apart: same digest as the version tag
      # means this exact commit is what's already published.
      - name: Check whether this version tag already exists
        id: guard
        env:
          TAG: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
          SHA_TAG: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          set +e
          output=$(docker buildx imagetools inspect "$TAG" 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -qi 'not found'; then
              echo "$TAG is unused -- ok to publish."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::could not determine whether $TAG exists:" >&2
            echo "$output" >&2
            exit 1
          fi

          version_digest=$(echo "$output" | awk '/^Digest:/ {print $2}')
          set +e
          sha_output=$(docker buildx imagetools inspect "$SHA_TAG" 2>&1)
          sha_status=$?
          set -e
          sha_digest=$(echo "$sha_output" | awk '/^Digest:/ {print $2}')
          if [ "$sha_status" -eq 0 ] && [ -n "$version_digest" ] && [ "$version_digest" = "$sha_digest" ]; then
            echo "::notice::$TAG already published from this exact commit; nothing to do." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$TAG already exists but $SHA_TAG does not match it -- the code moved on without a version bump. Bump \"version\" in pubspec.yaml." >&2
          exit 1

      # The OCI host is aarch64 while the runner is amd64. A single-arch
      # image pulls fine here and fails on the box with "no matching
      # manifest" -- a failure the "verify" step below turns into a red
      # build instead.
      - if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.guard.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Both tags are immutable: the version is what the box pins, the
          # sha is what ties a running container back to a commit.
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published manifest covers the deploy target
        if: steps.guard.outputs.skip != 'true'
        env:
          TAG: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
        run: |
          archs=$(docker buildx imagetools inspect "$TAG" --raw | jq -r '.manifests[].platform.architecture')
          echo "$archs" | grep -qx arm64 || {
            echo "::error::$TAG has no arm64 manifest; the OCI host is aarch64" >&2; exit 1; }
          echo "arm64 present."

      - name: Summary
        if: steps.guard.outputs.skip != 'true'
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}:${{ steps.version.outputs.value }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
